<div class=wrap>
 <h1>Class-E Calculator</h1>
 <p class=sub>The switch side, paired with the Tank Calculator. Sokal's finite-Q design
 equations: give it the rail and the load the passive network presents, and it returns the
 network the switch needs, the capacitor C119 has to make up, and what the device has to
 survive.</p>
 <h2>Result</h2>
 <div class=tiles>
 <div class=&quot;tile hero&quot;><div class=k>Power delivered</div><div class=v id=o_p>2.879 W</div><div class=n id=n_p>tank needs 1.350 W, which wants R = 107 Ω</div></div>
 <div class=&quot;tile hero&quot;><div class=k>C119 needed</div><div class=v id=o_c119>21.8 pF</div><div class=n id=n_c119>C_oss is 24% of C1 <span class=&quot;pill ok&quot;>ok</span></div></div>
 <div class=tile><div class=k>Drain peak</div><div class=v id=o_vpk>65.6 V</div><div class=n id=n_vpk><span class=&quot;pill warn&quot;>1.52x</span> on 100 V</div></div>
 <div class=tile><div class=k>Drain peak current</div><div class=v id=o_ipk>463 mA</div><div class=n id=n_ipk><span class=&quot;pill warn&quot;>1.47x</span> on 680 mA pulsed</div></div>
 </div>
 <h2>Inputs</h2>
 <div class=panel>
 <div class=grid>
 <div><label for=Vdd>V_x rail, V</label><input type=number id=Vdd value=17.8 step=0.1></div>
 <div><label for=R>Load R at drain, Ω</label><input type=number id=R value=50 step=1></div>
 <div><label for=QL>Loaded Q</label><input type=number id=QL value=2.8 step=0.1></div>
 <div><label for=f>Frequency, MHz</label><input type=number id=f value=27.12 step=0.01></div>
 <div><label for=L1>L102 choke, µH</label><input type=number id=L1 value=6.8 step=0.1></div>
 <div><label for=Coss>Device C_oss, pF</label><input type=number id=Coss value=7 step=0.1></div>
 <div><label for=Vdss>Device V_DSS, V</label><input type=number id=Vdss value=100 step=5></div>
 <div><label for=Ipulse>Device I pulsed, mA</label><input type=number id=Ipulse value=680 step=10></div>
 <div><label for=Qg>Gate charge Q_g, nC</label><input type=number id=Qg value=1.2 step=0.1></div>
 <div><label for=Idrv>Driver rating, mA</label><input type=number id=Idrv value=24 step=1></div>
 <div><label for=Ptgt>Tank needs, W</label><input type=number id=Ptgt value=1.35 step=0.05></div>
 </div>
 <div class=presets>
 <button type=button data-preset=now>As built: BSS123, 17.8 V</button>
 <button type=button data-preset=orig>Original: NDS7002A, 14.8 V</button>
 <button type=button data-preset=v148>Rail 14.8 V</button>
 <button type=button data-preset=v178>Rail 17.8 V</button>
 </div>
 </div>
 <h2>The chain</h2>
 <div class=chain id=chain><div class=step><div class=no>1</div><div><div class=what>Load coefficient</div><div class=eq>k_R = 0.576801 × (1.0000086 − 0.414395/Q − 0.577501/Q² + 0.205967/Q³)</div></div><div class=out>0.45436</div></div><div class=step><div class=no>2</div><div><div class=what>Power into R</div><div class=eq>P = k_R · V_x² / R = 0.4544 × 17.8² / 50</div></div><div class=out>2.879 W</div></div><div class=step><div class=no>3</div><div><div class=what>Shunt C at drain</div><div class=eq>C1 = 1/(34.2219·f·R)·(0.99866 + 0.91424/Q − 1.03175/Q²) + 0.6/(ω²L1)</div></div><div class=out>28.76 pF</div></div><div class=step><div class=no>4</div><div><div class=what>C119 to fit</div><div class=eq>C119 = C1 − C_oss = 28.76 − 7</div></div><div class=out>21.76 pF</div></div><div class=step><div class=no>5</div><div><div class=what>Series C</div><div class=eq>C2 = 1/(ωR)·1/(Q−0.104823)·(1.00121 + 1.01468/(Q−1.7879)) − 0.2/(ω²L1)</div></div><div class=out>86.25 pF</div></div><div class=step><div class=no>6</div><div><div class=what>Series L</div><div class=eq>L2 = Q·R/ω</div></div><div class=out>0.822 µH</div></div><div class=step><div class=no>7</div><div><div class=what>Peak drain voltage</div><div class=eq>V_pk = k(Q)·V_x, k = 3.684</div></div><div class=out>65.6 V</div></div><div class=step><div class=no>8</div><div><div class=what>DC and peak current</div><div class=eq>I_dc = P/V_x = 162 mA, I_pk = 2.862·I_dc</div></div><div class=out>463 mA</div></div><div class=step><div class=no>9</div><div><div class=what>Gate current demand</div><div class=eq>Q_g × f = 1.2e−9 × 27.12e6</div></div><div class=out>32.5 mA</div></div></div>
 <div id=alerts><div class=note><b>The stage and the tank disagree by 113%.</b> At 17.8 V into 50 Ω an ideally switching stage delivers 2.879 W, while the tank needs 1.350 W. Either the rail is higher than this load needs, or the stage is not converting at the efficiency the equations assume. Measuring DC input during a burst separates those two, and nothing else does.</div><div class=note><b>Gate demand exceeds the driver.</b> 33 mA against a 24 mA rating. That rating is a static figure rather than a peak limit, so the gate is still driven, but the output sags below its guaranteed levels while charging and edges slow. Class E assumes fast switching.</div></div>

 <h2>Loaded-Q sweep, at the rail and load above</h2>
 <div class=tablewrap><table id=sweepQ>
 <thead><tr><th>Q_L<th>C1<th>C119<th>C2<th>L2<th>Drain pk</thead>
 <tbody><tr><td>2.0<td>28.9 pF<td>21.9 pF<td>357.3 pF<td>0.59 µH<td>67.0 V<tr><td>2.4<td>28.9 pF<td>21.9 pF<td>135.0 pF<td>0.70 µH<td>66.1 V<tr class=here><td>2.8<td>28.8 pF<td>21.8 pF<td>86.2 pF<td>0.82 µH<td>65.6 V<tr><td>3.5<td>28.4 pF<td>21.4 pF<td>54.1 pF<td>1.03 µH<td>65.0 V<tr><td>5.0<td>27.6 pF<td>20.6 pF<td>30.6 pF<td>1.47 µH<td>64.4 V<tr><td>7.0<td>26.9 pF<td>19.9 pF<td>19.3 pF<td>2.05 µH<td>64.1 V<tr><td>10.0<td>26.3 pF<td>19.3 pF<td>12.3 pF<td>2.93 µH<td>63.8 V</table></div>
 <div class=note>
 <b>Sokal's expressions have a pole at Q_L = 1.7879</b>, visible in C2's denominator, and
 they are stated as valid above it. At Q_L = 2.8 that term contributes 1.00; at 2.0 it is
 4.78 and at 1.9 it is 9.05, so the equations go stiff well before they go singular.
 Treat anything under about 2.2 as needing a different method rather than a smaller number.
 </div>
 <div class=note>
 <b>Q_L is the one genuinely free parameter.</b> Raising it shrinks C1, which pushes C119
 down toward C_oss and hands the tank back to the transistor. Lowering it grows C1 and
 C2 but weakens harmonic filtering, which the board has no low-pass stage to make up for.
 2.8 was chosen deliberately, not inherited.
 </div>
 <div class=foot>
 Sokal's finite-Q equations (QEX 2001). Validated against <code>classe2</code> at the
 design point: C1 and L2 exact, R within 0.5%. C2 differs by about 1.2% because
 <code>classe2</code> omits the choke correction term for C2 while applying it to C1;
 the difference is well inside C107's trimmer range. Peak-voltage factor is fitted through
 the three values in <code>class-e-design.md</code> §4 and reproduces all three exactly.
 Ideal switching is assumed throughout: no R_DS(on) loss, no transition loss, so the
 power figure is what a perfectly switching stage would deliver, not what this one does.
 </div>
